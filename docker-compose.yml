# One command runs the whole platform:
#   docker compose up --build
# Then open http://localhost:8080 — nginx serves the built frontend and
# proxies /api and /ws to the API, so the browser sees a single origin and
# CORS never enters the picture in this setup.
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    environment:
      ENVIRONMENT: development
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: qly
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-before-production}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@qly.example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Seed runs before the server so the stack is demoable on first boot.
    command: >
      sh -c "python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongo_data:
